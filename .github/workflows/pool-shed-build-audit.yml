name: Pool Shed Build Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and run production gates
        run: npm run build
