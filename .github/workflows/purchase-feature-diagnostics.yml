name: Purchase feature diagnostics

on:
  push:
    branches:
      - feature/po-sales-order-parity-line-controls-20260930
  workflow_dispatch:

jobs:
  purchase-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Purchase parity regression
        run: node scripts/test-purchase-order-parity-v200.mjs
      - name: Full build
        run: npm run build
